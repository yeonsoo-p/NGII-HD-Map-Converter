defaults:
  - viz_layers
  - _self_

# NGII root folder to auto-open on startup. null = open empty; the user selects
# a folder via File > Open NGII folder. Relative paths resolve against the
# invocation cwd, not Hydra's run directory.
ngii_dir: examples/SEC13_고성교차로_고성리장만이동산정류장앞

ngii:
  # Required coordinate product. The loader refuses to silently ingest all
  # coordinate variants in a section.
  coordinate: HDMap_UTMK_정표고
  geometry:
    # Snap tolerance (m) used only when multipart line geometries need merging.
    multipart_snap_tolerance_m: 0.1
  encoding:
    # Max malformed/non-ASCII text-cell ratio before UTF-8 DBF overlay is skipped.
    utf8_dbf_invalid_non_ascii_ratio_max: 0.5
  sanity:
    # Max XY distance (m) for node-reference repair actions.
    node_match_tolerance_m: 0.5
    # Minimum dot product for topology direction comparison against a
    # same-direction lateral neighbor.
    direction_parallel_dot_min: 0.85
    # Minimum link geometry length (m); shorter links are removed by repair.
    link_min_length_m: 0.2
    warnings:
      missing_required_layers: true
      missing_sidecars: true
      duplicate_column_capitalization: true
      manual_field_rules: true
      unknown_manual_columns: true
      invalid_code_values: true
      unsupported_geometry: true
      unknown_layers: true
      unresolved_relationships: true
      global_id_collision: true
      duplicate_identical_ids: true
      duplicate_conflicting_ids: true
      link_endpoint_alignment: true
      link_direction_ambiguous: true
      link_topology_direction: true
      too_short_links: true
      dangling_relationships: true
      dangling_nodes: true
      reciprocal_relationships: true
    repairs:
      duplicate_conflicting_id_drop: true
      link_too_short_remove: true
      link_endpoint_direction_swap: true
      link_missing_node_ref_nearest: true
      link_missing_node_ref_remove: true
      link_topology_direction_swap: true
      dangling_relationship_remove: true
      dangling_node_remove: true
      reciprocal_relationship_fill: true
  text_repair:
    enabled: true
    repair_mojibake: true
    warn_unrepaired_replacement_chars: true

segmentation:
  enable_uturn: true
  enable_lateral_link_group: true
  enable_lateral_node_group: true
  enable_junction: true
  enable_junction_connection: true
  enable_connection_reference: true
  enable_connection_perpendicular: false
  # Max |dZ| (m) at an XY intersection to count as the same physical feature.
  z_intersection_tol_m: 2.0
  # Max planimetric distance (m) for grouping A1 NodeType=1 lateral endpoint
  # node groups into one bidirectional junction connection.
  junction_connection_node_merge_dist_m: 15.0
  # Minimum opposite-direction tangent dot product magnitude for pairing
  # inbound/outbound endpoint groups into one bidirectional junction connection.
  junction_connection_opposite_direction_dot_min: 0.85
  # Half-length (m) of the lateral perpendicular line drawn by the post-junction
  # perpendicular stage when that stage is enabled.
  connection_perpendicular_half_length_m: 5.0

viz:
  background_color: [0.86, 0.88, 0.90]
  highlight_rgb: [255, 30, 200]
  junction_connection_node_point_size: 12.0
  connection_reference_arrow_length_m: 12.0
  connection_reference_arrow_rgb: [25, 90, 255]
  selector_tol_point: 0.01
  selector_tol_line: 0.012
  selector_tol_poly: 0.0
  point_hit_radius_px: 12.0
  poly_depth_offset_factor: 2.0
  poly_depth_offset_units: 2.0
  segmentation_seed: 4217
  camera_focus:
    padding_m: 15.0
    min_scale_m: 20.0
    max_scale_m: 1000.0
  profiling:
    enabled: false
    slow_frame_ms: 33.0
    log_every_n_interactions: 1

hydra:
  job_logging:
    handlers:
      file:
        encoding: utf-8
